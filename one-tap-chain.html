<title>一指連鎖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=M+PLUS+Rounded+1c:wght@900&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：直式手機遊戲。明亮的竹林當背景（上方竹葉、下方草地），中間是竹綠色托盤上的 6×7 盤面；
   上方白色計分板放三個星星目標，盤面上方由熊貓用對話框說提示，下方是重來與提示。盤面每 10 關變大一次。
   整個遊戲只有一個視覺世界（竹林、熊貓黑白、陽光黃、珊瑚紅），所以固定用淺色。 */
:root{
  --sky:#cfeef7; --mist:#f4fbf1; --leaf:#4db869; --leaf-hi:#7fd88f; --leaf-deep:#1f7a44; --leaf-dark:#145c31;
  --cream:#fffdf6; --ink:#26332c; --ink-dim:#5d6f64; --line:#cfe3d2;
  --sun:#ffd24a; --sun-hi:#fff0a8; --sun-deep:#f2a81d; --coral:#ff6f61; --coral-deep:#d94a3d; --pink:#ff4f8b;
  --f-num:'Bungee','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-zh:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-title:'M PLUS Rounded 1c','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky) var(--bg-w, none) center/cover no-repeat; color:var(--ink); font-family:var(--f-zh);
  font-size:14px; line-height:1.5; -webkit-tap-highlight-color:transparent; overscroll-behavior:none}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0}
button:focus-visible, canvas:focus-visible{outline:3px solid var(--coral); outline-offset:2px}

.app{height:100%; max-width:480px; margin:0 auto; padding-inline:16px; padding-block:10px;
  display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;
  user-select:none; -webkit-user-select:none;
  background:var(--bg-p, none) center/cover no-repeat var(--mist);
  box-shadow:0 0 0 3px #fff, 0 0 50px rgba(20,92,49,.35)}

/* 計分板 */
.hudbox{display:flex; flex-direction:column; gap:10px; padding:8px 10px 9px; margin-inline:-6px; border-radius:20px;
  background:rgba(255,255,255,.9); box-shadow:0 0 0 2.5px var(--leaf), 0 6px 0 rgba(31,122,68,.22)}
.top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.pill{height:34px; padding:0 13px; border-radius:17px; background:#fff; border:2px solid var(--leaf);
  font-size:13.5px; font-weight:900; display:inline-flex; align-items:center; gap:6px; color:var(--leaf-deep); position:relative}
.pill:active{background:#e6f6e8}
.pill, .lv, .lv .tag{white-space:nowrap; flex:none}
@media (max-width:389px){ .lv .tag{display:none} }
.pill svg{width:18px; height:18px; fill:var(--leaf-deep)}
.pill.icon{width:34px; padding:0; justify-content:center; font-family:var(--f-num); font-weight:400}
.pill.off{border-color:#b9c7bc}
.pill.off svg{fill:#a3b1a6}
.pill.off::after{content:""; position:absolute; left:6px; right:6px; top:50%; height:2.5px; border-radius:2px; background:var(--coral); transform:rotate(-40deg)}
.top-btns{display:flex; gap:6px}
.lv{display:flex; align-items:baseline; gap:5px; font-weight:900; font-size:15px; color:var(--leaf-deep)}
.lv b{font-family:var(--f-num); font-weight:400; font-size:30px; line-height:.9; color:var(--coral)}
.lv .tag{align-self:center; margin-left:4px; font-size:11.5px; background:var(--sun); color:var(--ink); border-radius:8px; padding:1px 7px}

.goals{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.goal{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-width:0; padding:5px 2px 4px; border-radius:12px;
  background:#edf5ee; color:var(--ink-dim); font-size:12px; font-weight:700; line-height:1.25; text-align:center}
.goal b{font-family:var(--f-num); font-weight:400; color:var(--coral-deep); margin-left:4px}
.gstar{display:flex; gap:1px; height:20px}
.gstar svg, .rstar svg, .mstars svg{width:100%; height:100%; display:block; fill:#fff; stroke:#a9c0ae; stroke-width:1.5; stroke-linejoin:round}
.gstar svg{width:20px; height:20px}
.goal.on{background:#fff4c2; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--sun-deep)}
.goal.on .gstar svg, .rstar.on svg, .mstars .on{fill:url(#gold); stroke:#b9770a}
.goal.on .gstar{animation:gpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes gpop{0%{transform:scale(.4) rotate(-20deg)} 100%{transform:scale(1)}}
.prog-row{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13.5px; font-weight:700}
.prog-row b{font-family:var(--f-num); font-weight:400; font-size:17px; color:var(--coral-deep); font-variant-numeric:tabular-nums}

/* 熊貓＋對話框＋盤面 */
.stage{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px}
.tiprow{display:flex; align-items:center; gap:4px; width:100%; min-height:68px}
.pal{display:block; flex:none; background-image:var(--pals); background-size:400% 100%; background-repeat:no-repeat}
.pal.p0{background-position:0 0} .pal.p1{background-position:33.333% 0} .pal.p2{background-position:66.667% 0} .pal.p3{background-position:100% 0}
.buddy{width:68px; height:68px}
.buddy.hop{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)} 35%{transform:translateY(-10px) scale(1.08)} 100%{transform:translateY(0) scale(1)}}
.tip{flex:1; min-width:0; min-height:48px; display:flex; align-items:center; position:relative; padding:7px 12px; border-radius:16px;
  background:#fff; box-shadow:0 0 0 2px var(--leaf), 0 4px 0 rgba(31,122,68,.2); font-size:14.5px; font-weight:700; line-height:1.4; text-wrap:pretty}
.tip::before{content:""; position:absolute; left:-9px; top:50%; width:14px; height:14px; background:#fff; transform:translateY(-50%) rotate(45deg);
  box-shadow:-2px 2px 0 0 var(--leaf)}
.tip.guide{box-shadow:0 0 0 2.5px var(--pink), 0 4px 0 rgba(255,79,139,.25); font-weight:900}
.tip.guide::before{box-shadow:-2.5px 2.5px 0 0 var(--pink)}
.board{position:relative; padding:7px; border-radius:22px; background:linear-gradient(#63c67d,#3f9f5a);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 0 0 3px var(--leaf-deep), 0 8px 0 rgba(20,92,49,.3), 0 14px 26px rgba(20,92,49,.25)}
canvas{display:block; touch-action:manipulation; border-radius:14px}
.combo{position:absolute; right:-8px; top:-20px; transform:rotate(7deg); pointer-events:none; z-index:2;
  font-family:var(--f-num); font-size:28px; line-height:1; color:#fff; white-space:nowrap; background:var(--coral);
  border:3.5px solid #fff; border-radius:16px; padding:6px 12px 5px; box-shadow:0 0 0 2.5px var(--coral-deep), 0 5px 0 rgba(0,0,0,.2); opacity:0}
.combo.on{opacity:1; animation:pop .22s ease-out}
@keyframes pop{0%{transform:rotate(7deg) scale(1.7)} 100%{transform:rotate(7deg) scale(1)}}
.flash{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) rotate(-6deg) scale(.6); pointer-events:none;
  background:var(--coral); color:#fff; border:4px solid #fff; border-radius:20px;
  font-family:var(--f-title); font-weight:900; font-size:36px; letter-spacing:.14em; padding:2px 18px 4px 24px; white-space:nowrap;
  box-shadow:0 0 0 3px var(--coral-deep), 0 8px 0 rgba(0,0,0,.2); opacity:0}
.flash.on{animation:seal 1.1s ease-out forwards}
@keyframes seal{0%{opacity:0; transform:translate(-50%,-50%) rotate(-6deg) scale(2.2)} 14%{opacity:1; transform:translate(-50%,-50%) rotate(-6deg) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) rotate(-6deg) scale(1)}}

/* 底列 */
.foot{display:flex; align-items:center; justify-content:center; gap:12px; min-height:48px; padding-bottom:4px}
.btn2{height:44px; min-width:120px; padding:0 20px; border-radius:22px; font-weight:900; font-size:15.5px; letter-spacing:.08em;
  background:#fff; border:2px solid var(--leaf); color:var(--leaf-deep); box-shadow:0 4px 0 rgba(31,122,68,.3);
  display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn2:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(31,122,68,.3)}
.btn2.gold{background:linear-gradient(var(--sun-hi), var(--sun) 50%, #ffbe3a); color:var(--ink); border-color:#c98a10; box-shadow:0 4px 0 #c98a10}
.btn2.gold:active{box-shadow:0 1px 0 #c98a10}
.btn2.gold b{font-family:var(--f-num); font-weight:400}
.btn2:disabled{opacity:.5; cursor:default}

/* 標題頁 */
.title{position:absolute; inset:0; z-index:8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px)); text-align:center;
  background:linear-gradient(rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 70%), var(--bg-p, none) center/cover no-repeat var(--mist)}
.key{width:100%; aspect-ratio:16/9; max-width:100%; border-radius:22px; background:var(--mist) var(--key, none) center/cover no-repeat;
  box-shadow:0 0 0 5px #fff, 0 0 0 8px var(--leaf), 0 14px 0 rgba(20,92,49,.18), 0 20px 30px rgba(20,92,49,.25)}
.title h1{margin:18px 0 0; font-family:var(--f-title); font-weight:900; font-size:clamp(46px,15vw,66px); line-height:1.1; letter-spacing:.08em; text-indent:.08em; color:var(--ink);
  text-shadow:-3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff, 0 -4px 0 #fff, 0 4px 0 #fff, -4px 0 0 #fff, 4px 0 0 #fff;
  filter:drop-shadow(0 6px 0 var(--leaf)) drop-shadow(0 10px 10px rgba(20,92,49,.25))}
.title .sub{margin:8px 0 0; font-size:17px; font-weight:900; letter-spacing:.2em; text-indent:.2em; color:var(--leaf-deep)}
.tstats{display:flex; gap:10px; margin:4px 0 8px; font-weight:700; font-size:14px}
.tstats span{background:#fff; box-shadow:0 0 0 2px var(--leaf); border-radius:14px; padding:3px 12px}
.tstats b{font-family:var(--f-num); font-weight:400; color:var(--coral-deep)}
.cta{display:block; width:100%; max-width:320px; border-radius:26px; padding:13px; font-size:19px; font-weight:900; letter-spacing:.14em;
  background:linear-gradient(var(--leaf-hi), var(--leaf) 55%, #3fa85c); color:#fff; border:2.5px solid var(--leaf-deep); box-shadow:0 6px 0 var(--leaf-deep);
  text-shadow:0 2px 0 rgba(20,92,49,.5)}
.cta:active{transform:translateY(4px); box-shadow:0 2px 0 var(--leaf-deep)}
.linkbtn{padding:8px 14px; font-size:14.5px; font-weight:900; text-decoration:underline; text-underline-offset:4px; color:var(--leaf-dark)}

/* 卡片（結算、新機關、選關、規則）*/
.scrim{position:absolute; inset:0; z-index:9; background:rgba(20,70,40,.5)}
.sheet{position:absolute; left:14px; right:14px; top:50%; transform:translateY(-50%); z-index:10;
  background:var(--cream); color:var(--ink); border-radius:24px; text-align:center;
  box-shadow:0 0 0 4px #fff, 0 0 0 7px var(--leaf), 0 16px 0 rgba(20,92,49,.25), 0 24px 40px rgba(20,60,35,.4);
  animation:rise .3s cubic-bezier(.2,.9,.3,1.2)}
.sheet.haspal{top:calc(50% + 40px)}
.sheet-in{padding:18px 16px 16px; max-height:calc(100vh - 190px); overflow-y:auto; border-radius:24px}
@keyframes rise{from{transform:translateY(-44%) scale(.94); opacity:0}}
.peek{position:absolute; left:50%; top:-104px; width:120px; height:120px; margin-left:-60px; animation:hop .6s .1s cubic-bezier(.3,1.6,.5,1) both}
.rstars{display:flex; justify-content:center; align-items:flex-end; gap:6px; height:78px}
.rstar{width:62px; height:62px}
.rstar:nth-child(2){width:76px; height:76px}
.rstar svg{fill:#eef2ea; stroke:#bccabf}
.rstar.on{animation:rpop .5s cubic-bezier(.2,1.7,.4,1) both; filter:drop-shadow(0 4px 0 rgba(185,119,10,.45)) drop-shadow(0 0 10px rgba(255,200,60,.8))}
@keyframes rpop{0%{transform:scale(0) rotate(-60deg)} 100%{transform:scale(1)}}
.sheet h2{margin:8px 0 2px; font-family:var(--f-title); font-weight:900; font-size:30px; letter-spacing:.1em; color:var(--leaf-deep)}
.sheet p{margin:4px 0 0; font-size:14.5px; font-weight:500}
.sheet p b{font-family:var(--f-num); font-weight:400; font-size:17px; color:var(--coral-deep)}
.sheet .note{display:inline-block; margin-top:10px; background:#e9f6e6; border-radius:10px; padding:5px 12px; font-size:13.5px; font-weight:700}
.sheet .cta{margin:14px auto 0; max-width:none; font-size:18px}
.row2{display:flex; gap:8px; margin-top:12px}
.row2 button{flex:1; height:42px; border-radius:21px; background:#e9f6e6; font-weight:900; font-size:14.5px; color:var(--leaf-dark)}
.row2 button:active{background:#d4edd2}
.kicker{display:inline-block; background:var(--coral); color:#fff; font-weight:900; font-size:12.5px; letter-spacing:.14em; border-radius:9px; padding:2px 10px}
.spr{display:inline-block; width:96px; height:96px; background-image:var(--atlas); background-size:500% 200%; background-repeat:no-repeat}
.intro-art{width:118px; height:118px; margin:10px auto 0; border-radius:24px; background:linear-gradient(#f7fff2,#dff1dc); display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 2px var(--line), 0 5px 0 var(--line)}
.intro-art.wide{width:220px; gap:8px}
.zone{display:flex; justify-content:space-between; align-items:baseline; margin:14px 2px 6px; font-size:14px; font-weight:900; color:var(--leaf-deep)}
.zone span{font-size:12px; font-weight:700; color:var(--ink-dim)}
.map{display:grid; grid-template-columns:repeat(5,1fr); gap:10px 8px}
.lvbtn{display:flex; flex-direction:column; align-items:center; gap:3px}
.lvbtn .n{width:100%; aspect-ratio:1; max-width:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--f-num); font-size:19px; color:#fff; background:radial-gradient(circle at 35% 28%, var(--leaf-hi), var(--leaf) 60%, #3a9a56);
  box-shadow:0 4px 0 var(--leaf-deep), inset 0 0 0 2px rgba(255,255,255,.45)}
.lvbtn.bonus .n{background:radial-gradient(circle at 35% 28%, var(--sun-hi), var(--sun) 55%, var(--sun-deep)); color:var(--ink); box-shadow:0 4px 0 #c98a10, inset 0 0 0 2px rgba(255,255,255,.6)}
.lvbtn.cur .n{outline:3px solid var(--coral); outline-offset:2px}
.lvbtn:disabled{cursor:default}
.lvbtn:disabled .n{background:#e4eae2; color:#a9b5ab; box-shadow:0 4px 0 #c9d3c9}
.lvbtn:not(:disabled):active .n{transform:translateY(3px)}
.mstars{display:flex; gap:1px; height:13px}
.mstars svg{width:13px; height:13px; fill:#dfe6dc; stroke:none}
.rules{margin:10px 0 0; padding:0 0 0 1.3em; font-size:14px; display:flex; flex-direction:column; gap:5px; text-align:left}
.legend{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; margin-top:10px; font-size:13.5px; text-align:left}
.legend .ic{width:44px; height:44px; border-radius:11px; background:linear-gradient(#f7fff2,#dff1dc); box-shadow:0 0 0 1.5px var(--line); display:flex; align-items:center; justify-content:center}
.legend .spr{width:38px; height:38px}
.legend b{font-weight:900}
@media (prefers-reduced-motion:reduce){
  .sheet,.combo.on,.goal.on .gstar,.rstar.on,.buddy.hop,.peek{animation:none}
  .flash.on{animation:none; opacity:1; transform:translate(-50%,-50%) rotate(-6deg)}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a8"/><stop offset=".5" stop-color="#ffd24a"/><stop offset="1" stop-color="#f2a81d"/></linearGradient>
</defs></svg>

<div class="app" id="app">
  <div class="hudbox">
    <div class="top">
      <button class="pill" id="mapBtn" type="button">選關</button>
      <div class="lv"><span>第</span><b id="lvNum">1</b><span>關</span><span class="tag" id="lvTag" hidden>大關</span></div>
      <div class="top-btns">
        <button class="pill icon" id="rulesBtn" type="button" aria-label="規則">?</button>
        <button class="pill icon" id="musicBtn" type="button" aria-label="音樂開關"></button>
        <button class="pill icon" id="sfxBtn" type="button" aria-label="音效開關"></button>
      </div>
    </div>
    <div class="goals" id="goals" role="img" aria-label="目標">
      <div class="goal" id="g1"><span class="gstar"></span><span>炸彈全爆<b id="bombTxt">0/0</b></span></div>
      <div class="goal" id="g2"><span class="gstar"></span><span>剩 2 個以內</span></div>
      <div class="goal" id="g3"><span class="gstar"></span><span>全部清光</span></div>
    </div>
    <div class="prog-row">
      <span>還剩 <b id="leftN">0</b> 個</span>
      <span><b id="score">0</b> 分</span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="tiprow">
      <span class="pal buddy p0" id="buddy" role="img" aria-label="熊貓"></span>
      <div class="tip" id="tip" aria-live="polite"></div>
    </div>
    <div class="board" id="board">
      <canvas id="cv" tabindex="0" aria-label="遊戲盤面，方向鍵移動，Enter 選取或引爆"></canvas>
      <div class="combo" id="combo"></div>
      <div class="flash" id="flash"></div>
    </div>
  </div>

  <div class="foot">
    <button class="btn2" id="retryBtn" type="button">重來</button>
    <button class="btn2 gold" id="hintBtn" type="button">提示 <b id="hintN">3</b></button>
  </div>

  <div class="title" id="title">
    <div class="key" role="img" aria-label="熊貓用手掌點下炸彈，引發一整串連鎖"></div>
    <h1>一指連鎖</h1>
    <p class="sub">點一下，炸出一整串</p>
    <div class="tstats"><span>星星 <b id="tStars">0</b></span><span>玩到第 <b id="tLv">1</b> 關</span></div>
    <button class="cta" id="playBtn" type="button">開始</button>
    <button class="linkbtn" id="tMapBtn" type="button">選關</button>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
</div>

<script>

/* ===== 核心規則（純函式，不碰畫面）=====
   每一關只能點一次。所有炸彈都爆炸才算過關；剩下的東西越少分數越高，全部清光最高。 */
let W = 5, H = 5, N = 25;                       // 盤面大小會跟著關卡變
function setGrid(w, h) { W = w; H = h; N = w * h; }
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 上 右 下 左
const BASE = { bomb: 10, arrow: 10, cross: 10, link: 10, gem: 30, crate: 5, iron: 15 };
const ACTIVE = { bomb: true, arrow: true, cross: true, link: true };
const LEVELS = 50;
const SIZES = [[5, 5], [6, 6], [6, 7], [7, 8], [8, 9]];   // 每 10 關換一種盤面
const zoneOf = L => Math.min(SIZES.length - 1, Math.floor((L - 1) / 10));

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function countLeft(board) { let n = 0; for (let j = 0; j < N; j++) if (board[j]) n++; return n; }
function countBombs(board) { let n = 0; for (let j = 0; j < N; j++) if (board[j] && board[j].t === 'bomb') n++; return n; }
function deviceList(board) { const d = []; for (let j = 0; j < N; j++) if (board[j] && ACTIVE[board[j].t]) d.push(j); return d; }

/* 從 start 引爆。回傳每一波發生的事、連鎖得分、引爆後的盤面 after。不會改動傳入的 board。 */
function simulate(board, start) {
  const present = board.slice();
  const waves = [];
  let wave = [start], k = 0, score = 0, count = 0;
  while (wave.length) {
    k++;
    const items = [];
    for (const i of wave) {
      const o = present[i];
      if (o.t === 'iron' && (o.hp || 2) > 1) {          // 石塊第一下只會裂開
        const pts = 5 * k; score += pts;
        present[i] = { t: 'iron', hp: 1 };
        items.push({ i, o, pts, crack: true });
        continue;
      }
      const pts = BASE[o.t] * k; score += pts; count++;
      items.push({ i, o, pts });
    }
    for (const it of items) if (!it.crack) present[it.i] = null;
    const next = new Set();
    const fx = [];
    for (const it of items) {
      if (it.crack) continue;
      const i = it.i, o = it.o, x = i % W, y = (i / W) | 0;
      if (o.t === 'bomb') {
        const r = o.big ? 2 : 1;
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
          if (!dx && !dy) continue;
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const j = ny * W + nx;
          if (present[j]) next.add(j);
        }
        fx.push({ k: 'blast', i, r });
      } else if (o.t === 'arrow' || o.t === 'cross') {
        const dirs = o.t === 'arrow' ? [o.d] : o.ax === 'v' ? [0, 2] : [1, 3];      // 雙向盤只打橫向或直向
        for (const d of dirs) {
          let cx = x, cy = y, end = -1, hit = false;
          for (;;) {
            cx += DIRS[d][0]; cy += DIRS[d][1];
            if (cx < 0 || cy < 0 || cx >= W || cy >= H) break;
            const j = cy * W + cx; end = j;
            if (present[j]) { next.add(j); hit = true; break; }
          }
          fx.push({ k: 'beam', i, d, to: end, hit });
        }
      } else if (o.t === 'link') {
        for (let j = 0; j < N; j++) if (present[j] && present[j].t === 'link') { next.add(j); fx.push({ k: 'link', i, to: j }); }
        for (let d = 0; d < 4; d++) {
          const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
          if (nx >= 0 && ny >= 0 && nx < W && ny < H && present[ny * W + nx]) next.add(ny * W + nx);
        }
        fx.push({ k: 'ring', i });
      }
    }
    waves.push({ k, items, fx });
    wave = Array.from(next).sort((a, b) => a - b);
  }
  return { waves, score, count, after: present, k, remaining: countLeft(present), bombsLeft: countBombs(present) };
}

/* 星星：炸彈沒全爆 = 0（沒過關）；全爆 = 1；剩 2 個以內 = 2；全部清光 = 3 */
function starsFor(bombsLeft, left) {
  if (bombsLeft > 0) return 0;
  return left === 0 ? 3 : left <= 2 ? 2 : 1;
}
/* 分數：連鎖得分依清掉的比例打折，全部清光再加 50% */
function finalScore(chain, cleared, total) {
  if (!total) return 0;
  return Math.round(chain * (cleared / total) * (cleared >= total ? 1.5 : 1));
}
/* 把每一個能點的機關都試一次 */
function analyze(board) {
  const total = countLeft(board), out = [];
  for (const i of deviceList(board)) {
    const r = simulate(board, i);
    out.push({ i, left: r.remaining, bombsLeft: r.bombsLeft, depth: r.waves.length, stars: starsFor(r.bombsLeft, r.remaining), score: finalScore(r.score, total - r.remaining, total),
      hits: r.waves[1] ? r.waves[1].items.map(it => it.i) : [] });
  }
  return out;
}

/* 「看起來像源頭」的機關：一開始沒有任何機關直接打得到它。真正的源頭只有一個，其他都是假的 */
function apparentRoots(an) {
  const hit = new Set();
  for (const a of an) for (const j of a.hits) hit.add(j);
  return an.filter(a => !hit.has(a.i)).map(a => a.i);
}

/* ---------- 關卡設定 ---------- */
function levelCfg(L) {
  const z = zoneOf(L), p = (L - 1) % 10, size = SIZES[z];
  const bonus = L % 5 === 0;
  const lo = [6, 11, 15, 20, 26][z], hi = [12, 17, 22, 29, 38][z];
  let total = Math.round(lo + (hi - lo) * p / 9);
  if (bonus) total = Math.min(Math.round(size[0] * size[1] * 0.62), total + 3 + z);
  const c = { level: L, zone: z, w: size[0], h: size[1], bonus, total, cross: L >= 4 };
  c.gems = Math.max(1, Math.round(total * 0.16));
  c.crates = L >= 7 ? Math.max(1, Math.round(total * 0.07)) : 0;
  c.links = L >= 14 && (L % 3 === 2 || (bonus && L >= 20)) ? 3 : 0;
  c.dev = total - c.gems - c.crates - c.links;
  c.big = L >= 11 && (L % 2 === 1 || bonus) ? (z >= 3 ? 2 : 1) : 0;
  c.iron = L >= 21 && (L % 2 === 1 || z >= 4) ? 1 : 0;
  c.minBombs = Math.max(2, Math.ceil(c.dev * 0.3));
  return c;
}
/* 這一關第一次出現的新東西（給介紹卡用）*/
function levelIntro(L) {
  return { 4: 'cross', 7: 'crate', 11: 'bigbomb', 14: 'link', 21: 'iron' }[L] || null;
}
/* ---------- 關卡資料：50 關都是事先設計好的（tools/levelgen.js 產生並逐關驗證）----------
   每一關是一串字，一格一個字：
   . 空格　B 炸彈　X 大炸彈　^ > v < 火箭　- 橫向盤　| 直向盤　O 電球　g 寶石　c 木箱　I 石塊 */
let LEVEL_DATA = [];
function setLevels(d) { LEVEL_DATA = d; for (const k in levelCache) delete levelCache[k]; }
const CODE = { B: { t: 'bomb' }, X: { t: 'bomb', big: true }, '^': { t: 'arrow', d: 0 }, '>': { t: 'arrow', d: 1 }, v: { t: 'arrow', d: 2 }, '<': { t: 'arrow', d: 3 },
  '-': { t: 'cross', ax: 'h' }, '|': { t: 'cross', ax: 'v' }, O: { t: 'link' }, g: { t: 'gem' }, c: { t: 'crate' }, I: { t: 'iron', hp: 2 } };
function decodeBoard(str) { return Array.from(str, ch => (CODE[ch] ? Object.assign({}, CODE[ch]) : null)); }
function encodeBoard(board) {
  return board.map(o => !o ? '.' : o.t === 'bomb' ? (o.big ? 'X' : 'B') : o.t === 'arrow' ? '^>v<'[o.d] : o.t === 'cross' ? (o.ax === 'v' ? '|' : '-') : { link: 'O', gem: 'g', crate: 'c', iron: 'I' }[o.t]).join('');
}
const levelCache = {};
function genLevel(L) {
  const cfg = levelCfg(L);
  setGrid(cfg.w, cfg.h);
  if (levelCache[L]) return levelCache[L];
  const d = LEVEL_DATA[L - 1], board = decodeBoard(d.b);
  return (levelCache[L] = { board, W: cfg.w, H: cfg.h, total: countLeft(board), bombs: countBombs(board), solution: [d.s], cfg });
}

function computeReach(i) {

        const nx = x + dx, ny = y + dy; if ((dx || dy) && nx >= 0 && ny >= 0 && nx < W && ny < H) area.add(ny * W + nx);

function clearSel() { S.sel = -1; S.reach = null; }

// 瀏覽器規定要先有一次點擊才能出聲：第一次碰到畫面時把聲音和配樂打開
const wake = () => { if (audio()) startMusic(); };
document.addEventListener('pointerdown', wake, true);
document.addEventListener('keydown', wake, true);
$('hintBtn').addEventListener('click', useHint);
$('retryBtn').addEventListener('click', () => { if (S.phase !== 'chain' && !S.tut) { sfx.button(); startLevel(S.level, true); } });
$('mapBtn').addEventListener('click', () => { if (!S.sheet && S.phase !== 'chain' && !S.tut) { sfx.button(); renderMap(); } });
$('rulesBtn').addEventListener('click', () => { if (!S.sheet && S.phase !== 'chain') { sfx.button(); renderRules(); } });
$('playBtn').addEventListener('click', () => { sfx.button(); leaveTitle(unlocked()); });
$('tMapBtn').addEventListener('click', () => { sfx.button(); renderMap(); });
$('sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  sfx.button();
  if (b.dataset.lv) { const L = +b.dataset.lv; if (S.onTitle) leaveTitle(L); else startLevel(L); }
  else if (b.id === 'nextBtn') startLevel(S.level + 1);
  else if (b.id === 'againBtn') startLevel(S.level, true);
  else if (b.id === 'toMapBtn') renderMap();
  else if (b.id === 'okBtn') closeSheet();
  else if (b.id === 'closeBtn') { closeSheet(); if (S.phase === 'done' && !S.onTitle && S.lastR) renderResult(S.lastR, true); }
});
const ICON_NOTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';
const ICON_SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M14.5 8.2v7.6c1.4-.7 2.4-2.1 2.4-3.8s-1-3.1-2.4-3.8z"/></svg>';
function paintAudio() {
  const m = $('musicBtn'), s = $('sfxBtn');
  m.innerHTML = ICON_NOTE; m.classList.toggle('off', !musicOn); m.setAttribute('aria-pressed', String(musicOn)); m.setAttribute('aria-label', musicOn ? '音樂：開' : '音樂：關');
  s.innerHTML = ICON_SPK; s.classList.toggle('off', !sfxOn); s.setAttribute('aria-pressed', String(sfxOn)); s.setAttribute('aria-label', sfxOn ? '音效：開' : '音效：關');
}
$('musicBtn').addEventListener('click', () => { musicOn = !musicOn; store.set('music', musicOn); paintAudio(); setBus(); if (musicOn) startMusic(); });
$('sfxBtn').addEventListener('click', () => { sfxOn = !sfxOn; store.set('sfx', sfxOn); paintAudio(); setBus(); if (sfxOn) sfx.select(); });
window.addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe($('stage'));

/* ---------- 啟動（頁面更新時回到同一關）---------- */
function start(data) {
  paintAudio();
  // 背景先放一關當底，標題頁蓋在上面
  S.level = unlocked(); S.lv = genLevel(S.level); layout();
  S.board = S.lv.board.slice(); S.display = S.board.slice(); S.total = S.lv.total; S.left = S.total; S.bombs = S.lv.bombs; S.bombsLeft = S.bombs; S.born = now();
  hud(); setTip('');
  const d = data && data.run;
  if (d && d.v === 4 && !d.onTitle && d.level >= 1 && d.level <= unlocked()) leaveTitle(d.level); else showTitle();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) { try { document.fonts.load('20px Bungee'); } catch (e) { /* 字型載不到就用備用字 */ } }
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ run: { v: 4, level: S.level, onTitle: S.onTitle } })); } catch (e) { /* 沒有也沒關係 */ }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

})();
</script>
